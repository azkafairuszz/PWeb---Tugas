<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Form Validasi JavaScript</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section>
        <h1>REGISTRATION FORM</h1>
        <form class="card" id="reg" novalidate>
          <label for="nama">Name:</label>
          <input type="text" id="nama" placeholder="Enter your full name" />
          <span class="msg" id="e-nama"></span>

          <label for="alamat">Address:</label>
          <input type="text" id="alamat" placeholder="Enter your address" />
          <span class="msg" id="e-alamat"></span>

          <label for="email">E-mail Address:</label>
          <input type="email" id="email" placeholder="Enter your email" />
          <span class="msg" id="e-email"></span>

          <label for="pass">Password:</label>
          <input type="password" id="pass" />
          <span class="msg" id="e-pass"></span>

          <label for="course">Select Your Course:</label>
          <select id="course">
            <option value="">Select Course</option>
            <option>Teknik Informatika</option>
            <option>Sistem Informasi</option>
            <option>Teknik Elektro</option>
            <option>Teknik Mesin</option>
          </select>
          <span class="msg" id="e-course"></span>

          <label for="college">College Name:</label>
          <textarea id="college"></textarea>
          <span class="msg" id="e-college"></span>

          <div class="check">
            <input type="checkbox" id="agree" />
            <label for="agree">I agree to the above information</label>
          </div>
          <span class="msg" id="e-agree"></span>

          <div class="btns">
            <button type="submit">Send</button>
            <button type="reset" id="reset">Reset</button>
          </div>
          <div id="hasil" role="status"></div>
        </form>
      </section>

      <section>
        <form class="card" id="mail" novalidate>
          <h2>Email Validation Form</h2>
          <label for="em">Enter your email:</label>
          <input
            type="text"
            id="em"
            placeholder="example@domain.com"
            autocomplete="off"
          />
          <span class="msg" id="e-em" role="status"></span>
          <button type="submit" class="green">Submit</button>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
