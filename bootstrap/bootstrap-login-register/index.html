<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login &amp; Register - Split Screen Bootstrap 5</title>
    <!-- Bootstrap 5.3 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .login {
        min-height: 100vh;
      }

      /* Gambar pemandangan pegunungan bernuansa biru (gaya Start Bootstrap) */
      .bg-image {
        background-color: #0d47a1;
        background-image: url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1400&q=80");
        background-size: cover;
        background-position: center;
      }

      .login-heading {
        font-weight: 300;
      }

      .btn-login {
        font-size: 0.9rem;
        letter-spacing: 0.05rem;
        padding: 0.75rem 1rem;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid ps-md-0">
      <div class="row g-0">
        <!-- Kolom Kiri: Gambar Full Height -->
        <div class="d-none d-md-flex col-md-4 col-lg-6 bg-image"></div>

        <!-- Kolom Kanan: Form Login & Register -->
        <div class="col-md-8 col-lg-6 bg-white">
          <div class="login d-flex align-items-center py-5">
            <div class="container">
              <div class="row">
                <div class="col-md-9 col-lg-8 mx-auto">
                  <!-- ==================== FORM LOGIN ==================== -->
                  <div id="loginSection">
                    <h3 class="login-heading mb-4">Welcome back!</h3>

                    <form>
                      <div class="form-floating mb-3">
                        <input
                          type="email"
                          class="form-control"
                          id="loginEmail"
                          placeholder="name@example.com"
                          required
                        />
                        <label for="loginEmail">Email address</label>
                      </div>

                      <div class="form-floating mb-3">
                        <input
                          type="password"
                          class="form-control"
                          id="loginPassword"
                          placeholder="Password"
                          required
                        />
                        <label for="loginPassword">Password</label>
                      </div>

                      <div class="form-check mb-3">
                        <input
                          class="form-check-input"
                          type="checkbox"
                          value=""
                          id="rememberPasswordCheck"
                        />
                        <label
                          class="form-check-label text-muted"
                          for="rememberPasswordCheck"
                        >
                          Remember password
                        </label>
                      </div>

                      <div class="d-grid">
                        <button
                          class="btn btn-lg btn-primary btn-login text-uppercase fw-bold mb-2"
                          type="submit"
                        >
                          Sign in
                        </button>
                        <div class="text-center mt-2">
                          <a class="small text-decoration-none" href="#"
                            >Forgot password?</a
                          >
                        </div>
                        <div class="text-center mt-3">
                          <span class="small text-muted"
                            >Don't have an account?</span
                          >
                          <a
                            href="#"
                            class="small fw-semibold text-decoration-none"
                            onclick="
                              toggleForm('register');
                              return false;
                            "
                          >
                            Register here
                          </a>
                        </div>
                      </div>
                    </form>
                  </div>

                  <!-- ==================== FORM REGISTER ==================== -->
                  <div id="registerSection" class="d-none">
                    <h3 class="login-heading mb-4">Create an account!</h3>

                    <form>
                      <div class="form-floating mb-3">
                        <input
                          type="text"
                          class="form-control"
                          id="registerName"
                          placeholder="Full Name"
                          required
                        />
                        <label for="registerName">Full name</label>
                      </div>

                      <div class="form-floating mb-3">
                        <input
                          type="email"
                          class="form-control"
                          id="registerEmail"
                          placeholder="name@example.com"
                          required
                        />
                        <label for="registerEmail">Email address</label>
                      </div>

                      <div class="form-floating mb-3">
                        <input
                          type="password"
                          class="form-control"
                          id="registerPassword"
                          placeholder="Password"
                          required
                        />
                        <label for="registerPassword">Password</label>
                      </div>

                      <div class="form-floating mb-3">
                        <input
                          type="password"
                          class="form-control"
                          id="registerConfirmPassword"
                          placeholder="Confirm Password"
                          required
                        />
                        <label for="registerConfirmPassword"
                          >Confirm password</label
                        >
                      </div>

                      <div class="form-check mb-3">
                        <input
                          class="form-check-input"
                          type="checkbox"
                          value=""
                          id="agreeTermsCheck"
                          required
                        />
                        <label
                          class="form-check-label text-muted"
                          for="agreeTermsCheck"
                        >
                          I agree to the Terms &amp; Conditions
                        </label>
                      </div>

                      <div class="d-grid">
                        <button
                          class="btn btn-lg btn-primary btn-login text-uppercase fw-bold mb-2"
                          type="submit"
                        >
                          Register
                        </button>
                        <div class="text-center mt-3">
                          <span class="small text-muted"
                            >Already have an account?</span
                          >
                          <a
                            href="#"
                            class="small fw-semibold text-decoration-none"
                            onclick="
                              toggleForm('login');
                              return false;
                            "
                          >
                            Sign in
                          </a>
                        </div>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function toggleForm(target) {
        const loginSection = document.getElementById("loginSection");
        const registerSection = document.getElementById("registerSection");

        if (target === "register") {
          loginSection.classList.add("d-none");
          registerSection.classList.remove("d-none");
        } else {
          registerSection.classList.add("d-none");
          loginSection.classList.remove("d-none");
        }
      }
    </script>
  </body>
</html>
